server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: employee-service-route
          uri: lb://employee-service
          predicates:
            - Path=/employee/**
          filters:
            - StripPrefix=1

        - id: department-service-route
          uri: lb://department-service
          predicates:
            - Path=/department/**
          filters:
            - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    gateway:
      access: read-only

info:
  app:
    name: API Gateway Service
    version: 1.0.0

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
