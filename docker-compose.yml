services:

  service-registry:
    build:
      context: ./service-registry
    container_name: service-registry
    ports:
      - "8761:8761"

  employee-service:
    build:
      context: ./employee-service
    container_name: employee-service
    depends_on:
      - service-registry
    ports:
      - "8081:8081"

  department-service:
    build:
      context: ./department-service
    container_name: department-service
    depends_on:
      - service-registry
    ports:
      - "8082:8082"

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    depends_on:
      - service-registry
      - employee-service
      - department-service
    ports:
      - "8080:8080"
